<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09111b"><link rel="icon" href="data:,"><title>ExoSnap · Vier-Looks Direktvergleich</title>
<link rel="stylesheet" href="./pbr-lab.css">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<header class="site-head">
  <div class="toolbar">
    <label class="field model-field"><span>Controller</span><select id="controller" aria-label="3D-Modell"></select></label>
    <label class="field view-field"><span>Kamera</span><select id="view" aria-label="Gemeinsame Kameraposition"><option value="front" selected>Front</option><option value="angled">3/4</option><option value="profile">Seite</option></select></label>
    <label class="field size-field"><span>Größe</span><select id="panelSize" aria-label="Panelgröße"><option value="240">240 × 160</option><option value="320" selected>320 × 214</option><option value="480">480 × 320</option></select></label>
    <label class="field mix-field"><span class="mix-title">Materialmix <output id="mixValue">70 %</output></span><input type="range" min="0" max="100" step="1" value="70" id="materialMix" aria-label="Gemeinsamer Materialmix"><span class="range-labels"><i>0</i><i>50</i><i>100</i></span></label>
    <label class="field view-field"><span>Sticks</span><select id="stickPose" aria-label="Stickzustand"><option value="neutral">Neutral</option><option value="move">Bewegt</option><option value="click">L3/R3 gedrückt</option><option value="live">Live</option></select></label>
    <label class="press-field"><input type="checkbox" id="pressAll"> gedrückt</label>
    <label class="press-field" title="Environment Solid"><input type="checkbox" id="toggleSolid" data-look="solid" checked> A</label>
    <label class="press-field" title="Environment Ghost"><input type="checkbox" id="toggleGhost" data-look="ghost" checked> B</label>
    <label class="press-field" title="Outline Ghost"><input type="checkbox" id="toggleOutline" data-look="outline" checked> C</label>
    <label class="press-field" title="Hybrid Identity"><input type="checkbox" id="toggleIdentity" data-look="identity" checked> D</label>
    <label class="press-field" title="Optional beide Press-Farben koppeln"><input type="checkbox" id="colorSync"> Sync</label>
    <label class="field color-field"><span>2D aktiv</span><input id="color2D" type="color" value="#79bdff" aria-label="Aktivfarbe 2D"></label>
    <label class="field color-field"><span>3D aktiv</span><input id="color3D" type="color" value="#79bdff" aria-label="Aktivfarbe 3D"></label>
    <select id="renderMode" hidden><option value="shared">1× 3D + 3 Blits</option><option value="direct">3× 3D</option></select><button id="exportRecipe" hidden>Rezept exportieren</button>
  </div>
  <div class="status-row"><span id="rendererStatus" role="status">Originalmodell wird geladen …</span><span id="modelInfo"></span><a href="./screenshots.html" title="Aktuelle und ältere echte Browseraufnahmen" style="color:#9dd8fa;text-decoration:none;white-space:nowrap">Screenshots</a></div>
</header>
<main><div id="failureBanner" role="alert" hidden></div><div id="gallery" aria-label="Vier Look-Zeilen mit je sechs Vorschaufenstern"></div></main>
<script type="module" src="./pbr-lab.js"></script></body></html>
