name: Controller consistency source snapshot
on:
  push:
    branches: [fix/model-consistency]
    paths: [.github/workflows/consistency-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Snapshot public source and dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/controller-source"
          git bundle create "$RUNNER_TEMP/controller-source/history.bundle" HEAD
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/controller-source/source.tar.gz"
          tar czf "$RUNNER_TEMP/controller-source/dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: controller-consistency-source
          path: ${{ runner.temp }}/controller-source/
          retention-days: 3
