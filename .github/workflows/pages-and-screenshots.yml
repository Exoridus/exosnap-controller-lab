name: Verify, capture real WebGL screenshots, publish Pages
on:
  push:
    branches: [main, feat/controller-consolidation]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: exosnap-controller-lab-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify entire suite
        run: npm run verify
      - name: Download and verify MIT-licensed source meshes
        run: |
          node download-assets.mjs
          node tools/verify-licensed-assets.mjs
      - name: Vendor cleared controller assets into the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(assets): vendor verified MIT gamepad OBJ assets [skip ci]'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
          echo "ASSET_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install screenshot browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Start genuine local 3D renderer
        run: |
          nohup node server.mjs > "$RUNNER_TEMP/exosnap-http.log" 2>&1 &
          for i in $(seq 1 45); do if curl --fail --silent --output /dev/null http://127.0.0.1:8792/pbr-lab.html; then exit 0; fi; sleep 1; done
          cat "$RUNNER_TEMP/exosnap-http.log"
          exit 1
      - name: Capture real neutral + pressed 3D/2D screenshots
        env:
          CAPTURE_COMMIT_SHA: ${{ env.ASSET_SOURCE_SHA }}
        run: node tools/capture-pages.mjs --out .capture
      - name: Attach screenshots to this workflow run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-${{ env.ASSET_SOURCE_SHA }}
          path: .capture/
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
      - name: Archive permanently on visual-history branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ env.ASSET_SOURCE_SHA }}
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/visual-history"
          git clone --no-checkout --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$history"
          if git -C "$history" show-ref --verify --quiet refs/remotes/origin/visual-history; then
            git -C "$history" switch --quiet --track origin/visual-history
          else
            git -C "$history" switch --quiet --orphan visual-history
          fi
          node tools/archive-snapshots.mjs --capture .capture --archive "$history" --repo "$GH_REPO" --sha "$GH_SHA"
          git -C "$history" config user.name 'github-actions[bot]'
          git -C "$history" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$history" add index.json snapshots
          if ! git -C "$history" diff --cached --quiet; then
            git -C "$history" commit --quiet -m "visual: capture ${GH_SHA}"
            git -C "$history" push --quiet origin visual-history
          fi
      - name: Export static site with current screenshot and history
        run: node tools/build-pages.mjs --out dist --capture .capture --history "$RUNNER_TEMP/visual-history/index.json"
      # Refresh the fallback from THIS verified build; do not reuse the frozen
      # artifact from the first emergency Pages deployment.
      - name: Publish fresh verified site to pages-fallback
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$PWD/dist"
          test -s "$site/pbr-lab.html"
          test -s "$site/pbr-lab.js"
          test -s "$site/control-glyphs.js"
          test -s "$site/interior-housing-contours.js"
          test -f "$site/.nojekyll"
          # Full captures remain in immutable visual-history and CI artifacts.
          SITE="$site" python3 - <<'PY'
          import os,re
          from pathlib import Path
          site=Path(os.environ['SITE'])
          shots=site/'screenshots'
          links=set()
          for file in site.glob('*.html'):
              links.update(re.findall(r'[/]screenshots/([\w.-]+\.(?:png|webm))',
                                      file.read_text(encoding='utf-8'),re.I))
          links.update(('latest.png','pressed.png','gamecube.png','generic.png',
                        'generic-pressed.png','controller-demo.webm',
                        '3d-final-model-genericpro-mix0-front-neutral.png',
                        '3d-final-model-genericpro-mix70-front-neutral.png',
                        '3d-final-model-genericpro-mix100-front-neutral.png',
                        '3d-final-model-genericpro-mix70-angled-neutral.png'))
          missing=sorted(name for name in links if not (shots/name).is_file())
          if missing:
              raise RuntimeError('Referenced screenshot missing: '+str(missing))
          for file in shots.iterdir():
              if file.suffix.lower() in ('.png','.webm') and file.name not in links:
                  file.unlink()
          print('Live Pages fallback MiB:',
                round(sum(p.stat().st_size for p in site.rglob('*') if p.is_file())/1048576,2))
          PY
          checkout="$RUNNER_TEMP/pages-live-fallback"
          mkdir -p "$checkout"
          cd "$checkout"
          git init --initial-branch=pages-fallback
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code origin refs/heads/pages-fallback >/dev/null; then
            git fetch --depth=1 origin refs/heads/pages-fallback
            git checkout -B pages-fallback FETCH_HEAD
            git rm -r -q --ignore-unmatch .
          fi
          cp -a "$site/." "$checkout/"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Controller Lab ${GITHUB_SHA:0:12} [skip ci]"
            git push origin HEAD:refs/heads/pages-fallback
          fi
          git rev-parse HEAD
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # Feature branches produce review artifacts; the protected environment publishes main.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
