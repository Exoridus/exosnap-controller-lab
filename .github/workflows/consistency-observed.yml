name: Apply visually observed consistency corrections
on:
  push:
    branches: [fix/model-consistency]
    paths: [.github/workflows/consistency-observed.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/model-consistency'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source corrections and verify clean tree
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          python .github/model-observed-fixes.py
          node tools/generate-generic-pro.mjs
          rm .github/model-observed-fixes.py .github/workflows/consistency-observed.yml
          git add -A
          test "$(git write-tree)" = 9b33f9b5b1c442d4c4052def718fa4dbe2bbb9bf
          git restore --source=HEAD --staged --worktree .github/workflows
          npm run verify
          node tools/verify-licensed-assets.mjs
      - name: Commit reviewed source to isolated task branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(lab): retain collar coverage and soften Ghost legends after full visual review'
          git push origin HEAD:fix/model-consistency
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Capture critical follow-up views in real Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          nohup node server.mjs > /tmp/controller-server.log 2>&1 &
          cat > observed-capture.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'node:fs/promises';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--use-gl=angle','--use-angle=swiftshader-webgl','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1150,height:830}});const errors=[];page.on('pageerror',e=>errors.push(e.message));
          await fs.mkdir('.observed',{recursive:true});await page.goto('http://127.0.0.1:8792/pbr-lab.html');await page.waitForFunction(()=>document.body.dataset.renderReady==='three-rendered',null,{timeout:60000});
          async function set(id,value){const rev=await page.evaluate(()=>Number(document.body.dataset.renderRevision));await page.locator('#'+id).evaluate((e,v)=>{e.type==='checkbox'?e.checked=v:e.value=String(v);e.dispatchEvent(new Event(e.type==='range'?'input':'change',{bubbles:true}));},value);await page.waitForFunction(r=>Number(document.body.dataset.renderRevision)>r&&document.body.dataset.renderReady==='three-rendered',rev,{timeout:60000});}
          await set('demoToggle',false);
          for(const model of ['DualSenseCompact','Xbox360','Gamecube','GenericPro']){
            await set('controller',model);
            for(const mix of [0,70,100])for(const view of ['front','angled'])for(const pose of ['neutral','move']){
              await set('materialMix',mix);await set('view',view);await set('stickPose',pose);
              await page.screenshot({path:'.observed/'+model+'-'+mix+'-'+view+'-'+pose+'.png',fullPage:true});
            }
          }
          await fs.writeFile('.observed/errors.json',JSON.stringify(errors));await browser.close();if(errors.length)throw Error(errors.join('\n'));
          JS
          node observed-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-observed-corrections
          path: .observed/
          include-hidden-files: true
          retention-days: 30
