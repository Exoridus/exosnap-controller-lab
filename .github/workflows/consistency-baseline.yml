name: Controller consistency baseline and source comparison
on:
  push:
    branches: [fix/model-consistency]
    paths: [.github/workflows/consistency-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
      - name: Pin existing native artwork (read only)
        run: |
          mkdir -p .baseline/native
          python - <<'PY'
          import pathlib,urllib.request,json,hashlib
          sha='ee88ed6948795645a7e4d4d6fa497b63462c44f3'
          root=pathlib.Path('.baseline/native'); records=[]
          paths=[f'app/assets/gamepad/controllers/{p.name}/{file}' for p in pathlib.Path('references/controllers').iterdir() if p.is_dir() for file in ['source.svg','mapping.json']]
          paths+=['app/assets/gamepad/controllers/SOURCE-NOTICE.txt','app/assets/gamepad/controllers/README.md','app/quick/ExoSnap/Quick/GamepadArtwork.cpp','app/quick/ExoSnap/Quick/GamepadSprites.cpp']
          for path in paths:
            try:
              data=urllib.request.urlopen(f'https://raw.githubusercontent.com/Exoridus/exosnap/{sha}/{path}',timeout=30).read()
              dest=root/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              records.append({'path':path,'sha256':hashlib.sha256(data).hexdigest()})
            except Exception as e: records.append({'path':path,'error':str(e)})
          (root/'provenance.json').write_text(json.dumps({'repository':'Exoridus/exosnap','commit':sha,'files':records},indent=2))
          PY
      - name: Genuine baseline captures of every selectable model
        run: |
          nohup node server.mjs > /tmp/controller-http.log 2>&1 &
          cat > baseline-capture.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'node:fs/promises';
          const out='.baseline';await fs.mkdir(out,{recursive:true});
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--use-gl=angle','--use-angle=swiftshader-webgl','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1150,height:830}});const errors=[];page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:8792/pbr-lab.html');await page.waitForFunction(()=>document.body.dataset.renderReady==='three-rendered',null,{timeout:60000});
          async function input(id,value){const rev=await page.evaluate(()=>Number(document.body.dataset.renderRevision));await page.locator('#'+id).evaluate((e,v)=>{e.type==='checkbox'?e.checked=v:e.value=v;e.dispatchEvent(new Event(e.type==='range'?'input':'change',{bubbles:true}));},value);await page.waitForFunction(r=>Number(document.body.dataset.renderRevision)>r,rev);}
          await input('demoToggle',false);const models=await page.locator('#controller option').evaluateAll(ns=>ns.map(n=>({id:n.value,name:n.textContent})));const audit=[];
          for(const model of models){
            await input('controller',model.id);await page.waitForFunction(id=>window.__exoPbrLab?.model?.model.id===id&&document.body.dataset.renderReady==='three-rendered',model.id);await page.waitForTimeout(200);
            for(const [key,pose,press,view]of [['neutral','neutral',false,'front'],['motion','move',false,'angled'],['pressed','click',true,'front'],['shoulders','neutral',false,'top']]){
              await input('stickPose',pose);await input('pressAll',press);await input('view',view);await page.screenshot({path:out+'/'+model.id+'-'+key+'.png',fullPage:true});
            }
            await input('pressAll',false);await input('stickPose','neutral');await input('view','front');
            audit.push(await page.evaluate(()=>{const lab=window.__exoPbrLab;return {model:lab.model.model.id,meshes:lab.model.meshes.filter(m=>!m.isInstancedMesh).map(m=>({file:m.userData.sourceFile,role:m.userData.role,control:m.userData.control,color:m.material.color.getHexString(),opacity:m.material.opacity,source:m.userData.sourceColor.getHexString(),visible:m.visible,triangles:m.geometry.attributes.position.count/3})),flat:[...lab.flatReferences].map(([scene,r])=>({scene,id:r.layout.id,controls:r.controls.map(e=>({id:e.layer.id,control:e.control,role:e.layer.role,surface:e.surface?.id,geometry:[...e.group.querySelectorAll('path,ellipse,circle,rect')].filter(n=>!n.closest('defs')).map(n=>({id:n.id,cls:n.getAttribute('class'),fill:n.style.fill,alpha:n.style.fillOpacity,opacity:n.style.opacity,stroke:n.style.stroke,strokeWidth:n.style.strokeWidth}))}))}))};}));
          }
          await fs.writeFile(out+'/audit.json',JSON.stringify({models,audit,errors},null,2));if(errors.length)throw Error(errors.join('\n'));await browser.close();
          JS
          node baseline-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-model-baseline-and-native-artwork
          path: .baseline/
          include-hidden-files: true
          retention-days: 30
