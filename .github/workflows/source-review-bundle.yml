name: Apply verified controller source
on:
  push:
    branches: [fix/final-controller-demo]
    paths: [.github/workflows/source-review-bundle.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.ref == 'refs/heads/fix/final-controller-demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact hash-verified source changes
        run: |
          set -euo pipefail
          python .github/review-delta-1.py
          python .github/review-delta-2.py
          python .github/review-delta-3.py
          rm .github/review-delta-{1,2,3}.py .github/workflows/source-review-bundle.yml
          git add -A
          test "$(git write-tree)" = c25280acb407dc01db01ad9f38959949328490c8
      - name: Verify final source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
      - name: Commit verified source to the isolated task branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(lab): restore mechanical input demo and surface-bound controller markings'
          git push origin HEAD:fix/final-controller-demo
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
