name: 2D polish · pull request browser QA
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    name: Node tests and real Chromium 2D/3D captures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run entire regression suite (including 2D polish)
        run: npm run verify
      - name: Verify existing licensed 3D assets
        run: |
          node download-assets.mjs
          node tools/verify-licensed-assets.mjs
      - name: Prepare real Chrome browser for PR screenshots
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          npx playwright install ffmpeg
          if command -v google-chrome >/dev/null || command -v google-chrome-stable >/dev/null; then
            echo "EXO_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Start actual browser lab
        run: |
          nohup node server.mjs > "$RUNNER_TEMP/exosnap-http.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8792/polish-2d.html; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/exosnap-http.log"
          exit 1
      - name: Capture and assert genuine 2D acceptance matrix and 3D smoke
        env:
          CAPTURE_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .capture
          node tools/capture-pages.mjs --out .capture 2>&1 | tee .capture/browser-probe.log
      - name: Native Qt capability probes (not ExoSnap parity)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libdbus-1-3
          python3 -m venv "$RUNNER_TEMP/qt-probe"
          "$RUNNER_TEMP/qt-probe/bin/pip" install --disable-pip-version-check PySide6==6.12.0
          QSG_RHI_BACKEND=opengl LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$RUNNER_TEMP/qt-probe/bin/python" qt-port-example/verify_portability.py --fixtures .capture/qt-fixtures --out .capture/qt-native 2>&1 | tee .capture/native-probe.log
      - name: Ensure static Pages export preserves 3D gallery and all 2D screenshots
        run: node tools/build-pages.mjs --out dist --capture .capture
      - name: Publish real browser evidence as PR artifact (no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2d-polish-pr-browser-captures
          path: .capture/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
