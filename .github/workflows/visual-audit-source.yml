name: Apply verified visual polish and native probes
on:
  push:
    branches: [fix/visual-finish-qt-gate]
    paths: [.github/workflows/visual-audit-source.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact verified source delta
        run: |
          python3 .github/visual-delta.py
          rm .github/visual-delta.py
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          git add controller-lab-style.js pbr-appearance.js polish-2d-style.js tests/consolidated-2d.test.mjs tools/capture-pages.mjs .github/visual-delta.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(lab): integrate original stick supports and separate 2D surface and legend inks'
          git push origin HEAD:fix/visual-finish-qt-gate
          echo "CAPTURE_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Real Chromium acceptance
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          npx playwright install ffmpeg
          node server.mjs > /tmp/lab.log 2>&1 &
          EXO_BROWSER_CHANNEL=chrome node tools/capture-pages.mjs --out .capture
      - name: Native Qt probes
        run: |
          python3 -m venv "$RUNNER_TEMP/qt-probe"
          "$RUNNER_TEMP/qt-probe/bin/pip" install --disable-pip-version-check PySide6==6.12.0
          QSG_RHI_BACKEND=opengl LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$RUNNER_TEMP/qt-probe/bin/python" qt-port-example/verify_portability.py --fixtures .capture/qt-fixtures --out .capture/qt-native
      - name: Export static page
        run: node tools/build-pages.mjs --out dist --capture .capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-finish-review
          path: .capture/
          include-hidden-files: true
          retention-days: 30
